[workspace]
resolver = "2"
members = ["crates/project-io", "crates/desktop-host", "crates/asset-io", "crates/media-export", "crates/web-demo-host"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
fs_at = "=0.2.1"
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
remove_dir_all = "=1.0.0"
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.41.0"
png = "=0.18.1"
sha2 = "0.10"
tauri = { version = "2", default-features = false, features = [
    "compression",
    "dbus",
    "dynamic-acl",
    "wry",
    "x11",
] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
